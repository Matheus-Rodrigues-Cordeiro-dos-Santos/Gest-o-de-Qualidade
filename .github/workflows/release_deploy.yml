
name: Release e Deploy - CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:

  release:
    name: Criar Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes "Versão oficial da aplicação Gestão da Qualidade." \
            --verify-tag

  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v4
